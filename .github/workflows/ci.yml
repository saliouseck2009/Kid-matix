# Runs the project checks on every pull request and on every push to main.
# Each job runs one group of tool/check.sh, so a local run reproduces it.
# A pull request merges only when every job is green (docs/git-workflow.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with docs/status.md and the local SDK.
  FLUTTER_VERSION: 3.47.6
  JAVA_VERSION: 17

jobs:
  analyze:
    name: analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Code generation, format, analyze
        run: bash tool/check.sh analyze
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-analyze-log
          path: tool/logs/check-analyze.log
          retention-days: 7

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Tests with coverage, git hook tests
        run: bash tool/check.sh test
      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-test-log
          path: tool/logs/check-test.log
          retention-days: 7

  build-android:
    name: build android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Debug APK
        run: bash tool/check.sh build-android
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-build-android-log
          path: tool/logs/check-build-android.log
          retention-days: 7

  build-ios:
    name: build ios
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Debug iOS app without signing
        run: bash tool/check.sh build-ios
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-build-ios-log
          path: tool/logs/check-build-ios.log
          retention-days: 7
