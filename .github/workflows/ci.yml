# Runs tool/check.sh on every pull request and on every push to main.
# A pull request merges only when this check is green (docs/git-workflow.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep in sync with docs/status.md and the local SDK.
  FLUTTER_VERSION: 3.47.6

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Run tool/check.sh
        run: bash tool/check.sh

      - name: Upload check log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: check-log
          path: tool/logs/check.log
          retention-days: 7
