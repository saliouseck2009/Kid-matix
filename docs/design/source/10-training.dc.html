<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>S'entraîner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#221A4D}a:hover{color:#5B3DF5}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4F1FF; color: #221A4D; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column">

<div style="flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 24px 24px 16px">

<div style="display: flex; flex-direction: column; gap: 2px">
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.1">S'entraîner</h1>
<p style="margin: 0; font-size: 16px; font-weight: 700; color: #5D567A">Choisis une ou plusieurs tables.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{tables}}" as="t" hint-placeholder-count="12">
<button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}" style="min-height: 64px; background: {{t.bg}}; color: {{t.fg}}; border: 2px solid {{t.bd}}; border-bottom: 6px solid {{t.bd}}; border-radius: 18px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; cursor: pointer">{{t.label}}</button>
</sc-for>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Combien de questions ?</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #FFFFFF; border-radius: 18px">
<sc-for list="{{counts}}" as="c" hint-placeholder-count="3">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 48px; background: {{c.bg}}; color: {{c.fg}}; border: none; border-radius: 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Chrono</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #FFFFFF; border-radius: 18px">
<sc-for list="{{chronos}}" as="c" hint-placeholder-count="2">
<button type="button" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 48px; background: {{c.bg}}; color: {{c.fg}}; border: none; border-radius: 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
<p style="margin: 0; text-align: center; font-size: 15px; font-weight: 800; color: #5D567A">{{summary}}</p>
<button type="button" style="min-height: 58px; background: #5B3DF5; color: #FFFFFF; border: none; border-bottom: 6px solid #3A22B8; border-radius: 18px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; cursor: pointer">Lancer</button>
</div>

</div>

<nav aria-label="Navigation principale" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; padding: 8px 12px 12px; background: #FFFFFF; border-top: 2px solid #E4DEFF">
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; padding: 6px 0; background: transparent; border: none; border-radius: 16px; color: #5D567A; font-size: 13px; font-weight: 800; cursor: pointer">
<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#5D567A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4m0 1h11l-2 4 2 4H5"/></svg>
<span>Parcours</span>
</button>
<button type="button" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; padding: 6px 0; background: #E4DEFF; border: none; border-radius: 16px; color: #4A2FD6; font-size: 13px; font-weight: 800; cursor: pointer">
<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#4A2FD6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>
<span>S'entraîner</span>
</button>
<a href="Defis.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; box-sizing: border-box; padding: 6px 0; border-radius: 16px; color: #5D567A; font-size: 13px; font-weight: 800; text-decoration: none">
<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#5D567A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/></svg>
<span>Défis</span>
</a>
<button type="button" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 56px; padding: 6px 0; background: transparent; border: none; border-radius: 16px; color: #5D567A; font-size: 13px; font-weight: 800; cursor: pointer">
<svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true" fill="none" stroke="#5D567A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
<span>Profil</span>
</button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const sel = st.sel || { 2: true, 5: true };
const count = st.count || 10;
const chrono = st.chrono == null ? true : st.chrono;
const tables = [];
for (let t = 1; t <= 12; t++) {
const on = !!sel[t];
tables.push({
label: '×' + t,
bg: on ? '#5B3DF5' : '#FFFFFF',
fg: on ? '#FFFFFF' : '#221A4D',
bd: on ? '#3A22B8' : '#DDD6FF',
pressed: on ? 'true' : 'false',
toggle: () => {
const next = Object.assign({}, sel);
next[t] = !on;
this.setState({ sel: next });
}
});
}
const seg = (on) => ({ bg: on ? '#5B3DF5' : 'transparent', fg: on ? '#FFFFFF' : '#221A4D', pressed: on ? 'true' : 'false' });
const counts = [10, 20, 30].map((n) => Object.assign(seg(n === count), {
label: String(n), pick: () => this.setState({ count: n })
}));
const chronos = [['Avec chrono', true], ['Sans chrono', false]].map((c) => Object.assign(seg(c[1] === chrono), {
label: c[0], pick: () => this.setState({ chrono: c[1] })
}));
const n = tables.filter((t) => t.pressed === 'true').length;
const summary = n === 0 ? 'Choisis au moins une table' : (n === 1 ? '1 table' : n + ' tables') + ' · ' + count + ' questions';
return { tables: tables, counts: counts, chronos: chronos, summary: summary };
}
}
</script>
</body>
</html>
