<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Quiz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#221A4D}a:hover{color:#5B3DF5}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: #F4F1FF; color: #221A4D; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 12px">
<a href="Parcours.dc.html" aria-label="Quitter le quiz" style="display: flex; align-items: center; justify-content: center; flex: none; width: 48px; height: 48px; background: #FFFFFF; border-radius: 999px; text-decoration: none">
<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="#5D567A" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</a>
<div role="img" aria-label="Question 4 sur 10" style="flex: 1; height: 18px; background: #E4DEFF; border-radius: 999px; overflow: hidden">
<div style="width: 40%; height: 100%; background: #5B3DF5; border-radius: 999px"></div>
</div>
<div style="display: flex; align-items: center; gap: 2px; padding: 8px 12px; background: #FFC531; border-radius: 999px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">
<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="#221A4D"><path d="M13 2L4.5 13.5H11L10 22l8.5-11.5H12z"/></svg>
<span>×3</span>
</div>
</div>

<div style="display: flex; align-items: center; gap: 10px">
<svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="#5D567A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
<div role="img" aria-label="Temps restant" style="flex: 1; height: 10px; background: #E4DEFF; border-radius: 999px; overflow: hidden">
<div style="width: 70%; height: 100%; background: #FFC531; border-radius: 999px"></div>
</div>
</div>

<div style="position: relative; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; background: #FFFFFF; border-radius: 28px">
<div style="padding: 6px 14px; background: #E4DEFF; border-radius: 999px; font-size: 15px; font-weight: 800; color: #4A2FD6">Table de 5</div>
<div style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 68px; line-height: 1.1">5 × 7 = ?</div>
<svg viewBox="0 0 120 120" width="72" height="72" aria-hidden="true" style="position: absolute; right: 12px; bottom: -6px">
<circle cx="32" cy="24" r="10" fill="#FFC531"/>
<circle cx="88" cy="24" r="10" fill="#FFC531"/>
<rect x="16" y="20" width="88" height="90" rx="40" fill="#FFC531"/>
<circle cx="45" cy="56" r="11" fill="#FFFFFF"/>
<circle cx="75" cy="56" r="11" fill="#FFFFFF"/>
<circle cx="43" cy="54" r="5" fill="#221A4D"/>
<circle cx="73" cy="54" r="5" fill="#221A4D"/>
<path d="M50 78q10 9 20 0" fill="none" stroke="#221A4D" stroke-width="4" stroke-linecap="round"/>
</svg>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{answers}}" as="a" hint-placeholder-count="4">
<button type="button" onClick="{{a.pick}}" style="min-height: 84px; background: {{a.bg}}; color: {{a.fg}}; border: 2px solid {{a.bd}}; border-bottom: 7px solid {{a.bd}}; border-radius: 22px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 36px; cursor: pointer">{{a.label}}</button>
</sc-for>
</div>

<sc-if value="{{waiting}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; justify-content: center; min-height: 116px; box-sizing: border-box; padding: 16px; border: 3px dashed #C9BFFF; border-radius: 24px; font-size: 17px; font-weight: 800; color: #5D567A">Touche la bonne réponse</div>
</sc-if>

<sc-if value="{{isCorrect}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px; min-height: 116px; box-sizing: border-box; padding: 14px 16px 16px; background: #DDF3E6; border-radius: 24px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; color: #0C5A36">Bravo !</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px; color: #0C5A36">+10 XP</span>
</div>
<a href="Resultats.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; background: #137A4B; border-bottom: 5px solid #0C5A36; border-radius: 16px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #FFFFFF; text-decoration: none">Continuer</a>
</div>
</sc-if>

<sc-if value="{{isWrong}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 10px; min-height: 116px; box-sizing: border-box; padding: 14px 16px 16px; background: #FBE3DF; border-radius: 24px">
<div style="display: flex; align-items: baseline; justify-content: space-between">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px; color: #8F2114">Presque !</span>
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #8F2114">5 × 7 = 35</span>
</div>
<a href="Resultats.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 50px; background: #C8321F; border-bottom: 5px solid #8F2114; border-radius: 16px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 20px; color: #FFFFFF; text-decoration: none">Continuer</a>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const picked = this.state && this.state.picked != null ? this.state.picked : null;
const right = 35;
const answers = [30, 35, 12, 40].map((v) => {
let bg = '#FFFFFF', fg = '#221A4D', bd = '#DDD6FF';
if (picked !== null) {
if (v === right) { bg = '#137A4B'; fg = '#FFFFFF'; bd = '#0C5A36'; }
else if (v === picked) { bg = '#C8321F'; fg = '#FFFFFF'; bd = '#8F2114'; }
}
return {
label: String(v), bg: bg, fg: fg, bd: bd,
pick: () => { if (picked === null) this.setState({ picked: v }); }
};
});
return {
answers: answers,
waiting: picked === null,
isCorrect: picked === right,
isWrong: picked !== null && picked !== right
};
}
}
</script>
</body>
</html>
