<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; background: #FFFFFF; border-radius: 20px">

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const C = { nouveau: '#E3DEF7', revoir: '#E8604C', encours: '#FFC531', acquis: '#A99BF0', maitrise: '#4A2FD6' };
const status = (t, m) => {
if (t === 1 || t === 2) return C.maitrise;
if (t === 10) return m >= 7 && m <= 9 ? C.acquis : C.maitrise;
if (t === 5) {
if (m <= 4) return C.acquis;
if (m <= 7) return C.encours;
if (m === 8) return C.revoir;
}
return C.nouveau;
};
const cols = [];
for (let m = 1; m <= 10; m++) cols.push('×' + m);
const rows = [];
for (let t = 1; t <= 12; t++) {
const cells = [];
for (let m = 1; m <= 10; m++) cells.push({ color: status(t, m) });
rows.push({ label: String(t), cells: cells });
}
return { cols: cols, rows: rows };
}
}
</script>
