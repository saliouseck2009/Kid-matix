<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Bilan du test de départ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#221A4D}a:hover{color:#5B3DF5}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: #F4F1FF; color: #221A4D; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
<svg viewBox="0 0 200 130" width="200" height="130" aria-hidden="true">
<circle cx="24" cy="30" r="6" fill="#5B3DF5"/>
<rect x="38" y="70" width="10" height="10" rx="2" fill="#137A4B" transform="rotate(20 43 75)"/>
<circle cx="176" cy="36" r="6" fill="#137A4B"/>
<rect x="154" y="74" width="10" height="10" rx="2" fill="#5B3DF5" transform="rotate(-18 159 79)"/>
<path d="M62 62q-18-10-20-30" fill="none" stroke="#FFC531" stroke-width="12" stroke-linecap="round"/>
<path d="M138 62q18-10 20-30" fill="none" stroke="#FFC531" stroke-width="12" stroke-linecap="round"/>
<ellipse cx="82" cy="122" rx="12" ry="6" fill="#E0A100"/>
<ellipse cx="118" cy="122" rx="12" ry="6" fill="#E0A100"/>
<circle cx="72" cy="36" r="10" fill="#FFC531"/>
<circle cx="128" cy="36" r="10" fill="#FFC531"/>
<rect x="56" y="32" width="88" height="90" rx="40" fill="#FFC531"/>
<path d="M76 68q9-10 18 0" fill="none" stroke="#221A4D" stroke-width="4" stroke-linecap="round"/>
<path d="M106 68q9-10 18 0" fill="none" stroke="#221A4D" stroke-width="4" stroke-linecap="round"/>
<path d="M86 86q14 16 28 0z" fill="#221A4D"/>
</svg>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.15">Tu connais déjà 3 tables !</h1>
<p style="margin: 0; font-size: 16px; font-weight: 700; color: #5D567A; line-height: 1.3">Elles sont ouvertes dans ton parcours. Leurs étoiles restent à gagner.</p>
</div>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 16px; background: #FFFFFF; border-radius: 24px">
<sc-for list="{{tables}}" as="t" hint-placeholder-count="12">
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 72px; background: {{t.bg}}; color: {{t.fg}}; border-radius: 18px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 24px">
<span>{{t.label}}</span>
<sc-if value="{{t.open}}" hint-placeholder-val="{{false}}">
<svg viewBox="0 0 24 24" width="18" height="18" role="img" aria-label="Table ouverte" fill="none" stroke="#FFC531" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
</sc-if>
</div>
</sc-for>
</div>

<div style="display: flex; justify-content: center; gap: 20px; font-size: 14px; font-weight: 800; color: #5D567A">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; background: #5B3DF5; border-radius: 5px"></span>Déjà connue</span>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 14px; height: 14px; background: #E3DEF7; border-radius: 5px"></span>À découvrir</span>
</div>

<button type="button" style="margin-top: auto; min-height: 58px; background: #5B3DF5; color: #FFFFFF; border: none; border-bottom: 6px solid #3A22B8; border-radius: 18px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; cursor: pointer">Voir mon parcours</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const known = { 1: true, 2: true, 10: true };
const tables = [];
for (let t = 1; t <= 12; t++) {
const open = !!known[t];
tables.push({ label: '×' + t, open: open, bg: open ? '#5B3DF5' : '#E3DEF7', fg: open ? '#FFFFFF' : '#5D567A' });
}
return { tables: tables };
}
}
</script>
</body>
</html>
