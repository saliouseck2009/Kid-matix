<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Étape Découverte</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#221A4D}a:hover{color:#5B3DF5}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 24px; background: #F4F1FF; color: #221A4D; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; gap: 18px">

<div style="display: flex; align-items: center; gap: 12px">
<button type="button" aria-label="Quitter" style="display: flex; align-items: center; justify-content: center; flex: none; width: 48px; height: 48px; background: #FFFFFF; border: none; border-radius: 999px; cursor: pointer">
<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="#5D567A" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
</button>
<div role="img" aria-label="Avant la première question" style="flex: 1; height: 18px; background: #E4DEFF; border-radius: 999px"></div>
</div>

<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 30px; line-height: 1.1">Voici la table de 5</h1>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-rows: repeat(5, auto); grid-auto-flow: column; gap: 10px 16px; padding: 20px; background: #FFFFFF; border-radius: 24px">
<sc-for list="{{lines}}" as="l" hint-placeholder-count="10">
<div style="display: flex; align-items: baseline; justify-content: space-between; padding: 8px 12px; background: #F4F1FF; border-radius: 14px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px">
<span>{{l.op}}</span>
<span style="color: #4A2FD6">{{l.res}}</span>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: center; gap: 12px; padding: 16px; background: #FFF3CF; border-radius: 24px">
<svg viewBox="0 0 120 120" width="72" height="72" aria-hidden="true" style="flex: none">
<ellipse cx="42" cy="110" rx="12" ry="6" fill="#E0A100"/>
<ellipse cx="78" cy="110" rx="12" ry="6" fill="#E0A100"/>
<circle cx="32" cy="24" r="10" fill="#FFC531"/>
<circle cx="88" cy="24" r="10" fill="#FFC531"/>
<rect x="16" y="20" width="88" height="90" rx="40" fill="#FFC531"/>
<circle cx="45" cy="56" r="11" fill="#FFFFFF"/>
<circle cx="75" cy="56" r="11" fill="#FFFFFF"/>
<circle cx="48" cy="56" r="5" fill="#221A4D"/>
<circle cx="78" cy="56" r="5" fill="#221A4D"/>
<path d="M50 78q10 9 20 0" fill="none" stroke="#221A4D" stroke-width="4" stroke-linecap="round"/>
<path d="M54 92l12 10m0-10l-12 10" fill="none" stroke="#5B3DF5" stroke-width="4" stroke-linecap="round"/>
</svg>
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">L'astuce</span>
<span style="font-size: 16px; font-weight: 700; line-height: 1.3">Les résultats de la table de 5 finissent toujours par 0 ou par 5.</span>
</div>
</div>

<button type="button" style="margin-top: auto; min-height: 58px; background: #5B3DF5; color: #FFFFFF; border: none; border-bottom: 6px solid #3A22B8; border-radius: 18px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; cursor: pointer">À moi de jouer</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const lines = [];
for (let m = 1; m <= 10; m++) lines.push({ op: '5 × ' + m, res: String(5 * m) });
return { lines: lines };
}
}
</script>
</body>
</html>
