<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Création de profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#221A4D}a:hover{color:#5B3DF5}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 20px 24px; background: #F4F1FF; color: #221A4D; font-family: 'Nunito', sans-serif; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; gap: 12px">
<button type="button" aria-label="Retour" style="display: flex; align-items: center; justify-content: center; flex: none; width: 48px; height: 48px; background: #FFFFFF; border: none; border-radius: 999px; cursor: pointer">
<svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="#5D567A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
</button>
<h1 style="margin: 0; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 26px">Nouveau joueur</h1>
</div>

<svg viewBox="0 0 64 64" width="92" height="92" aria-hidden="true" style="align-self: center">
<path d="{{preview.ears}}" fill="{{preview.bg}}"/>
<circle cx="32" cy="34" r="26" fill="{{preview.bg}}"/>
<circle cx="23" cy="31" r="4" fill="{{preview.face}}"/>
<circle cx="41" cy="31" r="4" fill="{{preview.face}}"/>
<path d="{{preview.mouth}}" fill="none" stroke="{{preview.face}}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="pseudo" style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Ton pseudo</label>
<input id="pseudo" type="text" maxlength="12" placeholder="Écris ton pseudo" style="height: 56px; box-sizing: border-box; padding: 0 16px; background: #FFFFFF; border: 2px solid #A99BF0; border-radius: 16px; font-size: 20px; font-weight: 800; color: #221A4D">
<span style="font-size: 14px; font-weight: 700; color: #5D567A">2 à 12 lettres ou chiffres</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Choisis ton avatar</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{avatars}}" as="a" hint-placeholder-count="12">
<button type="button" aria-label="{{a.label}}" onClick="{{a.pick}}" style="display: flex; align-items: center; justify-content: center; height: 72px; background: #FFFFFF; border: 3px solid {{a.ring}}; border-radius: 18px; cursor: pointer">
<svg viewBox="0 0 64 64" width="52" height="52" aria-hidden="true">
<path d="{{a.ears}}" fill="{{a.bg}}"/>
<circle cx="32" cy="34" r="26" fill="{{a.bg}}"/>
<circle cx="23" cy="31" r="4" fill="{{a.face}}"/>
<circle cx="41" cy="31" r="4" fill="{{a.face}}"/>
<path d="{{a.mouth}}" fill="none" stroke="{{a.face}}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 18px">Ta couleur</span>
<div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{swatches}}" as="s" hint-placeholder-count="6">
<button type="button" aria-label="{{s.label}}" onClick="{{s.pick}}" style="display: flex; align-items: center; justify-content: center; height: 48px; background: transparent; border: 3px solid {{s.ring}}; border-radius: 999px; cursor: pointer">
<span style="width: 34px; height: 34px; background: {{s.hex}}; border-radius: 999px"></span>
</button>
</sc-for>
</div>
</div>

<button type="button" style="margin-top: auto; min-height: 58px; background: #5B3DF5; color: #FFFFFF; border: none; border-bottom: 6px solid #3A22B8; border-radius: 18px; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 22px; cursor: pointer">C'est parti !</button>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const st = this.state || {};
const color = st.color || '#5B3DF5';
const sel = st.sel == null ? 0 : st.sel;
const face = color === '#FFC531' ? '#221A4D' : '#FFFFFF';
const ears = [
'M10 6l8 20 14-10zM54 6l-8 20-14-10z',
'M4 14a9 9 0 1 0 18 0a9 9 0 1 0-18 0zM42 14a9 9 0 1 0 18 0a9 9 0 1 0-18 0z',
'M32 2l6 10h-12z',
'M17 24V5q7-2 9 6v11zM47 24V5q-7-2-9 6v11z',
'M22 12l-4-10h4l4 9zM42 12l4-10h-4l-4 9z',
'M0 0'
];
const mouths = ['M23 43q9 8 18 0', 'M25 42h14q-7 10-14 0z'];
const avatars = [];
for (let i = 0; i < 12; i++) {
avatars.push({
ears: ears[i % 6], mouth: mouths[i < 6 ? 0 : 1], bg: color, face: face,
ring: i === sel ? '#221A4D' : 'transparent',
label: 'Avatar ' + (i + 1),
pick: () => this.setState({ sel: i })
});
}
const names = [['#5B3DF5', 'Violet'], ['#137A4B', 'Vert'], ['#FFC531', 'Jaune'], ['#D9482F', 'Rouge'], ['#1F6FD6', 'Bleu'], ['#B8328A', 'Rose']];
const swatches = names.map((n) => ({
hex: n[0], label: n[1],
ring: n[0] === color ? '#221A4D' : 'transparent',
pick: () => this.setState({ color: n[0] })
}));
return { avatars: avatars, swatches: swatches, preview: avatars[sel] };
}
}
</script>
</body>
</html>
