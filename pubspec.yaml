name: kid_matix
description: "Kid Matix: a gamified app that helps children master maths facts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Third-party packages are added by tool/setup.sh with `flutter pub add`, so
# that each one is pinned to the latest version compatible with this SDK.
dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.0.2
  intl: any
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
