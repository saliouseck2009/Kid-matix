name: kid_matix
description: "Kid Matix: a gamified app that helps children master maths facts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Third-party packages are added by tool/setup.sh with `flutter pub add`, so
# that each one is pinned to the latest version compatible with this SDK.
dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.0.2
  intl: any
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path: ^1.9.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4+1
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  json_serializable: ^6.14.1
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/sounds/

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf

# App icon and launch screen, made from the mascot by
# tool/icon/render_icon_test.dart; regenerate with
# dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: false
  image_path: tool/icon/out/icon.png
  adaptive_icon_background: "#5B3DF5"
  adaptive_icon_foreground: tool/icon/out/icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  web: false
  color: "#5B3DF5"
  image: tool/icon/out/splash.png
  android_12:
    color: "#5B3DF5"
    image: tool/icon/out/icon_foreground.png
    icon_background_color: "#5B3DF5"
