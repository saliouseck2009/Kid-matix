name: kid_matix
description: "Kid Matix: a gamified app that helps children master maths facts."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Third-party packages are added by tool/setup.sh with `flutter pub add`, so
# that each one is pinned to the latest version compatible with this SDK.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-Variable.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
